<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070912">
<title>DON’T STOP – Progress</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>:root{--line:rgba(255,255,255,.11);--text:#fff;--muted:#a5aec5;--accent:#735cff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#070912;color:var(--text);font-family:Inter,system-ui,sans-serif}body{padding:18px}.shell{width:min(1100px,100%);margin:auto}.card{background:#0d111f;border:1px solid var(--line);border-radius:28px;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.back,.home{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:#151b2c;color:#fff;text-decoration:none;font-weight:900;cursor:pointer;pointer-events:auto;touch-action:manipulation}.title{font-size:clamp(28px,6vw,44px);font-weight:950;letter-spacing:-.05em}.sub{color:var(--muted);line-height:1.5;margin-bottom:15px}.avatar-garage{margin-top:18px;padding:18px;border:1px solid rgba(115,92,255,.25);border-radius:22px;background:#101629}.avatar-garage h2{margin:0 0 5px}.avatar-sub{margin:0 0 14px;color:var(--muted);font-size:.9rem;line-height:1.5}.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.avatar-card{padding:12px;border-radius:18px;border:1px solid var(--line);background:#0b1020;text-align:center}.avatar-card img{display:block;width:100%;height:220px;object-fit:contain}.avatar-card h3{margin:6px 0 4px;font-size:.95rem}.avatar-card p{margin:0 0 8px;color:var(--muted);font-size:.76rem;line-height:1.4;min-height:34px}.avatar-cost{color:#ffe27a;font-weight:900;font-size:.8rem;margin-bottom:8px}.avatar-btn{width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;background:#151b2c;color:#fff;font-weight:850;cursor:pointer;touch-action:manipulation}.avatar-btn.active{background:linear-gradient(135deg,#735cff,#a24dff);border-color:transparent}.avatar-btn:disabled{opacity:.55;cursor:not-allowed}@media(max-width:900px){.avatar-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.avatar-grid{grid-template-columns:1fr}.avatar-card img{height:260px}}</style>
<script>(()=>{const gh=location.hostname.endsWith('.github.io');const native=!gh&&(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||/Capacitor/i.test(navigator.userAgent));if(native)document.documentElement.classList.add('native','is-native-app');})();</script>
</head>
<body>
<main class="shell"><section class="card"><div class="top"><a class="back" href="./index.html">← ZURÜCK</a><a class="home" href="./game.html">▶ SPIELEN</a></div><div class="title">⚡ DON’T STOP</div><div class="sub">Dein kompletter Fortschritt: Upgrades, Welten, Missionen, Daily Reward und Prestige.</div><div id="avatarShop" class="avatar-garage"></div><div id="progressRoot"></div></section></main>
<script src="./save.js?v=stable6"></script><script src="./progression.js?v=stable6"></script><script src="./avatar-shop.js?v=avatar1"></script>
<script>window.addEventListener('DOMContentLoaded',()=>{if(!window.DontStopProgression){const e=document.getElementById('progressRoot');if(e)e.textContent='Progress konnte nicht geladen werden.'}});</script>
</body></html>
