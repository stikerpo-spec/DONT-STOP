<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070912">
<title>DON’T STOP – Garage</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--line:rgba(255,255,255,.11);--text:#fff;--muted:#a5aec5;--accent:#735cff;--good:#2be3b0;--gold:#ffe27a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#070912;color:var(--text);font-family:Inter,system-ui,sans-serif}body{padding:18px}.shell{width:min(1150px,100%);margin:auto}.card{background:#0d111f;border:1px solid var(--line);border-radius:28px;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.back,.home{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:#151b2c;color:#fff;text-decoration:none;font-weight:900;cursor:pointer;pointer-events:auto;touch-action:manipulation}.title{font-size:clamp(28px,6vw,44px);font-weight:950;letter-spacing:-.05em}.sub{color:var(--muted);line-height:1.5;margin-bottom:15px}.section{margin-top:18px;padding:18px;border:1px solid rgba(115,92,255,.2);border-radius:22px;background:#101629}.section h2{margin:0 0 6px}.section-sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.avatar-card{padding:12px;border-radius:18px;border:1px solid var(--line);background:#0b1020;text-align:center}.avatar-card img{display:block;width:100%;height:220px;object-fit:contain}.avatar-card h3{margin:6px 0 4px;font-size:.95rem}.avatar-card p{margin:0 0 8px;color:var(--muted);font-size:.76rem;line-height:1.4;min-height:34px}.avatar-cost{color:var(--gold);font-weight:900;font-size:.8rem;margin-bottom:8px}.avatar-btn,.level-btn{width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;background:#151b2c;color:#fff;font-weight:850;cursor:pointer;touch-action:manipulation}.avatar-btn.active,.level.active .level-btn{background:linear-gradient(135deg,#735cff,#a24dff);border-color:transparent}.avatar-btn:disabled,.level-btn:disabled{opacity:.55;cursor:not-allowed}.levels-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.level{padding:14px;border:1px solid var(--line);border-radius:18px;background:#0b1020}.level.active{border-color:rgba(115,92,255,.75);box-shadow:0 0 0 1px rgba(115,92,255,.2)}.level h3{margin:0 0 4px}.level .name{font-weight:900;color:#cfd5e8}.level .desc{min-height:48px;margin:8px 0;color:var(--muted);font-size:.75rem;line-height:1.45}.level .price{margin-bottom:8px;color:var(--gold);font-weight:900;font-size:.8rem}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.pill{padding:7px 10px;border-radius:999px;background:#0a0f1e;border:1px solid var(--line);font-size:.78rem}.progress-note{margin-top:10px;color:var(--muted);font-size:.78rem}@media(max-width:1000px){.levels-grid{grid-template-columns:repeat(3,1fr)}.avatar-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.levels-grid,.avatar-grid{grid-template-columns:1fr}.avatar-card img{height:260px}}
</style>
<script>(()=>{const gh=location.hostname.endsWith('.github.io');const native=!gh&&(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||/Capacitor/i.test(navigator.userAgent));if(native)document.documentElement.classList.add('native','is-native-app');})();</script>
</head>
<body>
<main class="shell"><section class="card"><div class="top"><a class="back" href="./index.html">← ZURÜCK</a><a class="home" href="./game.html">▶ SPIELEN</a></div><div class="title">⚡ DON’T STOP GARAGE</div><div class="sub">Level wählen, deinen Runner verbessern und immer schwierigere Inhalte freischalten.</div><section class="section"><h2>🎯 LEVELS 1–20</h2><p class="section-sub">Freischalten mit Coins. Jedes Level erhöht Tempo und Hindernisdichte.</p><div id="levels" class="levels-grid"></div><div id="levelMeta" class="meta"></div></section><div id="avatarShop" class="section"></div><div id="progressRoot"></div></section></main>
<script src="./save.js?v=stable10"></script><script src="./progression.js?v=stable10"></script><script src="./levels20.js?v=stable10"></script>
<script>
(()=>{
 const root=document.getElementById('avatarShop'); if(!root)return;
 const items=[{id:'starter',name:'STARTER',price:0,img:'./assets/avatar-starter.svg',desc:'Ausgewogener Runner.'},{id:'speedster',name:'SPEED RUNNER',price:2500,img:'./assets/avatar-speed.svg',desc:'Leichte Speed-Ausrüstung.'},{id:'collector',name:'COLLECTOR',price:12500,img:'./assets/avatar-starter.svg',desc:'Coin-orientierte Ausstattung.'},{id:'ninja',name:'NINJA',price:50000,img:'./assets/avatar-elite.svg',desc:'Agiler Runner.'},{id:'robot',name:'ARMORED',price:150000,img:'./assets/avatar-armor.svg',desc:'Schwere Schutz-Ausrüstung.'},{id:'void',name:'ELITE VOID',price:500000,img:'./assets/avatar-elite.svg',desc:'Seltene Endgame-Ausrüstung.'}];
 const read=()=>window.DontStopSave?.read?.()||{}; const set=p=>window.DontStopSave?.set?.(p)||false; const avatar=()=>({skin:'starter',owned:['starter'],...(read().avatar||{})});
 function render(){const s=read(),a=avatar();root.innerHTML='<h2>🧍 AVATAR GARAGE</h2><p class="section-sub">Kaufe Runner mit Coins und rüste sie aus. Die Auswahl wird direkt im Spiel übernommen.</p>';const grid=document.createElement('div');grid.className='avatar-grid';items.forEach(item=>{const owned=(a.owned||[]).includes(item.id),active=a.skin===item.id,card=document.createElement('article');card.className='avatar-card';const img=document.createElement('img');img.src=item.img;img.alt=item.name;const h=document.createElement('h3');h.textContent=item.name;const p=document.createElement('p');p.textContent=item.desc;const c=document.createElement('div');c.className='avatar-cost';c.textContent=item.price?`🪙 ${item.price.toLocaleString('de-DE')}`:'KOSTENLOS';const b=document.createElement('button');b.type='button';b.className='avatar-btn'+(active?' active':'');b.textContent=active?'AUSGERÜSTET':owned?'AUSRÜSTEN':`KAUFEN • ${item.price.toLocaleString('de-DE')} 🪙`;b.disabled=active||(!owned&&Number(s.coins||0)<item.price);b.onclick=()=>{const cur=avatar();if((cur.owned||[]).includes(item.id)){set({avatar:{...cur,skin:item.id},progression:{...(read().progression||{}),character:item.id}});render();return}const now=read();if(Number(now.coins||0)<item.price)return;set({coins:Number(now.coins||0)-item.price,avatar:{...cur,skin:item.id,owned:[...(cur.owned||['starter']),item.id]},progression:{...(now.progression||{}),character:item.id}});render()};card.append(img,h,p,c,b);grid.appendChild(card)});root.appendChild(grid)}
 render();window.addEventListener('dontstop:saved',render);
})();
</script>
<script>window.addEventListener('DOMContentLoaded',()=>{if(!window.DontStopProgression){const e=document.getElementById('progressRoot');if(e)e.innerHTML='<div class="progress-note">Zusatzfunktionen werden geladen …</div>'}});</script>
</body></html>
