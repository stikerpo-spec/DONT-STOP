<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070912">
<title>DON’T STOP – Progress</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--line:rgba(255,255,255,.11);--text:#fff;--muted:#a5aec5;--accent:#735cff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#070912;color:var(--text);font-family:Inter,system-ui,sans-serif}body{padding:18px}.shell{width:min(1100px,100%);margin:auto}.card{background:#0d111f;border:1px solid var(--line);border-radius:28px;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.back,.home{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:#151b2c;color:#fff;text-decoration:none;font-weight:900;cursor:pointer;pointer-events:auto;touch-action:manipulation}.title{font-size:clamp(28px,6vw,44px);font-weight:950;letter-spacing:-.05em}.sub{color:var(--muted);line-height:1.5;margin-bottom:15px}.native-only{display:none}.native .native-only{display:block}
</style>
<script>(()=>{const gh=location.hostname.endsWith('.github.io');const native=!gh&&(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||/Capacitor/i.test(navigator.userAgent));if(native)document.documentElement.classList.add('native','is-native-app');})();</script>
</head>
<body>
<main class="shell"><section class="card"><div class="top"><a class="back" href="./index.html">← ZURÜCK</a><a class="home" href="./game.html">▶ SPIELEN</a></div><div class="title">⚡ DON’T STOP</div><div class="sub">Dein kompletter Fortschritt: Upgrades, Welten, Missionen, Daily Reward und Prestige.</div><div id="progressRoot"></div></section></main>
<script src="./save.js?v=stable5"></script>
<script src="./progression.js?v=stable5"></script>
<script>window.addEventListener('DOMContentLoaded',()=>{if(!window.DontStopProgression){const e=document.getElementById('progressRoot');if(e)e.textContent='Progress konnte nicht geladen werden.'}});</script>
</body></html>
