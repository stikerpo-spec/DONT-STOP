<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070912">
<title>DON’T STOP – Garage</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>:root{--line:rgba(255,255,255,.11);--text:#fff;--muted:#a5aec5;--accent:#735cff;--good:#2be3b0;--gold:#ffe27a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#070912;color:var(--text);font-family:Inter,system-ui,sans-serif}body{padding:18px}.shell{width:min(1100px,100%);margin:auto}.card{background:#0d111f;border:1px solid var(--line);border-radius:28px;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.back,.home{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:#151b2c;color:#fff;text-decoration:none;font-weight:900;cursor:pointer;pointer-events:auto;touch-action:manipulation}.title{font-size:clamp(28px,6vw,44px);font-weight:950;letter-spacing:-.05em}.sub{color:var(--muted);line-height:1.5;margin-bottom:15px}.avatar-garage{margin-top:18px;padding:18px;border:1px solid rgba(115,92,255,.25);border-radius:22px;background:#101629}.avatar-garage h2{margin:0 0 5px}.avatar-sub{margin:0 0 14px;color:var(--muted);font-size:.9rem;line-height:1.5}.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.avatar-card{padding:12px;border-radius:18px;border:1px solid var(--line);background:#0b1020;text-align:center}.avatar-card img{display:block;width:100%;height:220px;object-fit:contain}.avatar-card h3{margin:6px 0 4px;font-size:.95rem}.avatar-card p{margin:0 0 8px;color:var(--muted);font-size:.76rem;line-height:1.4;min-height:34px}.avatar-cost{color:var(--gold);font-weight:900;font-size:.8rem;margin-bottom:8px}.avatar-btn{width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;background:#151b2c;color:#fff;font-weight:850;cursor:pointer;touch-action:manipulation}.avatar-btn.active{background:linear-gradient(135deg,#735cff,#a24dff);border-color:transparent}.avatar-btn:disabled{opacity:.55;cursor:not-allowed}@media(max-width:900px){.avatar-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.avatar-grid{grid-template-columns:1fr}.avatar-card img{height:260px}}</style>
<script>(()=>{const gh=location.hostname.endsWith('.github.io');const native=!gh&&(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||/Capacitor/i.test(navigator.userAgent));if(native)document.documentElement.classList.add('native','is-native-app');})();</script>
</head>
<body>
<main class="shell"><section class="card"><div class="top"><a class="back" href="./index.html">← ZURÜCK</a><a class="home" href="./game.html">▶ SPIELEN</a></div><div class="title">⚡ DON’T STOP GARAGE</div><div class="sub">Verbessere deinen Runner mit Coins. Die Ausrüstung wird direkt im Spiel sichtbar.</div><div id="avatarShop" class="avatar-garage"></div><div id="progressRoot"></div></section></main>
<script src="./save.js?v=stable7"></script><script src="./progression.js?v=stable7"></script>
<script>
(()=>{
 const root=document.getElementById('avatarShop'); if(!root)return;
 const items=[
  {id:'starter',name:'STARTER',price:0,img:'./assets/avatar-starter.svg',desc:'Ausgewogener Runner.'},
  {id:'speed',name:'SPEED RUNNER',price:2500,img:'./assets/avatar-speed.svg',desc:'Leichte Speed-Ausrüstung.'},
  {id:'armor',name:'ARMORED',price:12500,img:'./assets/avatar-armor.svg',desc:'Schwere Schutz-Ausrüstung.'},
  {id:'elite',name:'ELITE',price:50000,img:'./assets/avatar-elite.svg',desc:'Seltene Elite-Ausrüstung.'}
 ];
 const read=()=>window.DontStopSave?.read?.()||{}; const set=p=>window.DontStopSave?.set?.(p)||false;
 const avatar=()=>({skin:'starter',owned:['starter'],...(read().avatar||{})});
 function render(){if(!window.DontStopSave)return;const s=read(),a=avatar();root.innerHTML='<h2>🧍 AVATAR GARAGE</h2><p class="avatar-sub">Kaufe bessere Outfits und rüste deinen Runner sichtbar auf.</p>';const grid=document.createElement('div');grid.className='avatar-grid';for(const item of items){const owned=(a.owned||[]).includes(item.id),active=a.skin===item.id,card=document.createElement('article');card.className='avatar-card';const img=document.createElement('img');img.src=item.img;img.alt=item.name;const h=document.createElement('h3');h.textContent=item.name;const p=document.createElement('p');p.textContent=item.desc;const cost=document.createElement('div');cost.className='avatar-cost';cost.textContent=item.price?`🪙 ${item.price.toLocaleString('de-DE')}`:'KOSTENLOS';const btn=document.createElement('button');btn.type='button';btn.className='avatar-btn'+(active?' active':'');btn.disabled=active||(!owned&&Number(s.coins||0)<item.price);btn.textContent=active?'AUSGERÜSTET':owned?'AUSRÜSTEN':`KAUFEN • ${item.price.toLocaleString('de-DE')} 🪙`;btn.onclick=()=>{const latest=read(),cur={skin:'starter',owned:['starter'],...(latest.avatar||{})};if((cur.owned||[]).includes(item.id)){set({avatar:{...cur,skin:item.id}});render();return;}if(Number(latest.coins||0)<item.price)return;set({coins:Number(latest.coins||0)-item.price,avatar:{...cur,skin:item.id,owned:[...(cur.owned||['starter']),item.id]}});render();};card.append(img,h,p,cost,btn);grid.appendChild(card)}root.appendChild(grid)}
 render();window.addEventListener('dontstop:saved',render);
})();
</script>
<script>window.addEventListener('DOMContentLoaded',()=>{if(!window.DontStopProgression){const e=document.getElementById('progressRoot');if(e)e.textContent='Progress konnte nicht geladen werden.'}});</script>
</body></html>
