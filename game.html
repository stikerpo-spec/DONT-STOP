<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050711">
  <title>DON’T STOP — 3D Game</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#050711;--line:rgba(255,255,255,.12);--text:#f7f9ff;--muted:#9da7c0;--accent:#7a5cff;--good:#29e3ad;--gold:#ffe27a;--danger:#ff4e78}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{position:fixed;inset:0}.game{position:fixed;inset:0}.scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:linear-gradient(180deg,#07152e 0%,#102d4b 43%,#070912 73%,#04050a 100%)}
    .atmosphere{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}.horizon{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 43%,rgba(151,205,255,var(--horizon-opacity,.35)) 0%,rgba(66,104,142,.14) 23%,transparent 56%);mix-blend-mode:screen}.vignette{position:absolute;inset:-8%;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.22) 72%,rgba(0,0,0,.64) 100%)}.speed-lines{position:absolute;left:0;right:0;top:38%;bottom:0;opacity:var(--speed-opacity,.16);background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.025) 9.2% 9.45%,transparent 9.65% 18%);transform:perspective(500px) rotateX(72deg);transform-origin:center top;animation:flow .8s linear infinite}@keyframes flow{from{transform:perspective(500px) rotateX(72deg) translateY(-2%)}to{transform:perspective(500px) rotateX(72deg) translateY(7%)}}.dust{position:absolute;inset:54% 0 0;background:radial-gradient(circle at 20% 80%,rgba(255,255,255,.05),transparent 12%),radial-gradient(circle at 72% 76%,rgba(255,255,255,.045),transparent 10%),radial-gradient(circle at 52% 92%,rgba(255,255,255,.035),transparent 13%);opacity:.7}.runner-name{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));z-index:7;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(7,10,20,.46);backdrop-filter:blur(12px);font-size:11px;font-weight:900;color:#d7dcf0;pointer-events:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;pointer-events:none;z-index:5}.top-btn,.stats{pointer-events:auto;border:1px solid var(--line);background:rgba(7,10,20,.64);backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.25)}.top-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;border-radius:16px}.stat{text-align:center;min-width:0}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{font-size:14px}.save-pill{font-size:10px;color:var(--good);white-space:nowrap}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(3,5,12,.48);backdrop-filter:blur(3px);z-index:10}.overlay.hidden{display:none}.card{width:min(430px,100%);padding:28px;border:1px solid var(--line);border-radius:28px;background:rgba(9,13,26,.9);box-shadow:0 30px 100px rgba(0,0,0,.55);text-align:center}.card h1{margin:0 0 8px;font-size:clamp(38px,8vw,54px);letter-spacing:-.06em}.card p{margin:0 0 20px;color:var(--muted);line-height:1.6}.eyebrow{display:inline-flex;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:rgba(122,92,255,.12);border:1px solid rgba(122,92,255,.28);font-size:10px;font-weight:900;letter-spacing:.12em}.buttons{display:grid;gap:10px}.btn{width:100%;min-height:50px;border:1px solid var(--line);border-radius:16px;background:#ffffff09;color:#fff;font:800 15px inherit;cursor:pointer;text-decoration:none}.btn.primary{background:linear-gradient(135deg,var(--accent),#a14dff);border-color:transparent}.hint{margin-top:12px;color:#737d98;font-size:11px;line-height:1.5}.controls{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;z-index:6}.control{height:58px;border:1px solid var(--line);border-radius:18px;background:rgba(7,10,20,.62);backdrop-filter:blur(14px);color:#fff;font-size:23px;font-weight:1000;touch-action:manipulation;box-shadow:0 12px 30px rgba(0,0,0,.24)}.control:active{transform:scale(.98)}
    @media(min-width:760px){.controls{display:none}.hud{padding-left:18px;padding-right:18px}.stats{width:min(620px,70vw);justify-self:center}.top-btn{width:48px;height:48px}.runner-name{right:20px}}
    @media(prefers-reduced-motion:reduce){.speed-lines{animation:none}.scene{transition:none}}
  </style>
</head>
<body>
  <main class="game">
    <canvas id="scene" class="scene" aria-label="3D-Spielarena"></canvas>
    <div class="hud">
      <a class="top-btn" href="./index.html" aria-label="Hauptmenü">←</a>
      <div class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>BEST</span><b id="best">0</b></div><div class="stat"><span>COINS</span><b id="coins">0</b></div><div class="stat"><span>LEVEL</span><b id="level">1 • NORMAL</b></div></div>
      <div id="savePill" class="save-pill">GESPEICHERT</div>
    </div>
    <div id="overlay" class="overlay"><section class="card"><div class="eyebrow">3D ENDLESS RUNNER</div><h1>DON’T STOP</h1><p id="overlayText">Laufe durch die 3D-Strecke, weiche Hindernissen aus und sammle Coins. Für jedes erfolgreich vermiedene Hindernis bekommst du +1 Coin.</p><div class="buttons"><button id="startBtn" class="btn primary">PLAY</button><button id="resumeBtn" class="btn" hidden>RUN FORTSETZEN</button><a class="btn" href="./index.html">HAUPTMENÜ</a></div><div class="hint">PC: ← → / A D · Springen: ↑ / W / Leertaste · Handy: Buttons oder Wischen</div></section></div>
    <div class="controls"><button id="leftBtn" class="control" aria-label="Nach links">◀</button><button id="jumpBtn" class="control" aria-label="Springen">⬆</button><button id="rightBtn" class="control" aria-label="Nach rechts">▶</button></div>
  </main>
  <script src="./save.js"></script>
  <script src="./build-info.js"></script>
  <script src="./update.js"></script>
  <script src="./realism.js"></script>
  <script src="./game.js"></script>
</body>
</html>
