<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050711">
  <title>DON’T STOP — 3D Game</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{--line:rgba(255,255,255,.12);--text:#f7f9ff;--muted:#9da7c0;--accent:#7a5cff;--good:#29e3ad}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:var(--text);font-family:Inter,system-ui,sans-serif}
    body{position:fixed;inset:0}.game{position:fixed;inset:0}.scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#050711}
    .hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;pointer-events:none;z-index:20}.top-btn,.stats{pointer-events:auto;border:1px solid var(--line);background:rgba(7,10,20,.68);backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.25)}.top-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;border-radius:16px}.stat{text-align:center;min-width:0}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{font-size:14px}.save-pill{font-size:10px;color:var(--good);white-space:nowrap}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(3,5,12,.5);backdrop-filter:blur(3px);z-index:30;pointer-events:none}.overlay.hidden{display:none}.overlay .card{pointer-events:auto;width:min(430px,100%);padding:28px;border:1px solid var(--line);border-radius:28px;background:rgba(9,13,26,.94);box-shadow:0 30px 100px rgba(0,0,0,.55);text-align:center}.card h1{margin:0 0 8px;font-size:clamp(38px,8vw,54px);letter-spacing:-.06em}.card p{margin:0 0 20px;color:var(--muted);line-height:1.6}.eyebrow{display:inline-flex;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:rgba(122,92,255,.12);border:1px solid rgba(122,92,255,.28);font-size:10px;font-weight:900;letter-spacing:.12em}.buttons{display:grid;gap:10px}.btn{width:100%;min-height:50px;border:1px solid var(--line);border-radius:16px;background:#ffffff09;color:#fff;font:800 15px inherit;cursor:pointer;text-decoration:none;pointer-events:auto;touch-action:manipulation}.btn.primary{background:linear-gradient(135deg,var(--accent),#a14dff);border-color:transparent}.hint{margin-top:12px;color:#737d98;font-size:11px;line-height:1.5}
    .controls{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;z-index:25;pointer-events:none}.control{height:58px;border:1px solid var(--line);border-radius:18px;background:rgba(7,10,20,.66);backdrop-filter:blur(14px);color:#fff;font-size:23px;font-weight:1000;touch-action:manipulation;pointer-events:auto;cursor:pointer}.control:active{transform:scale(.98)}
    @media(min-width:760px){.controls{display:none}.hud{padding-left:18px;padding-right:18px}.stats{width:min(620px,70vw);justify-self:center}.top-btn{width:48px;height:48px}}
  </style>
</head>
<body>
  <main class="game">
    <canvas id="scene" class="scene" aria-label="3D-Spielarena"></canvas>
    <div class="hud"><a class="top-btn" href="./index.html" aria-label="Hauptmenü">←</a><div class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>BEST</span><b id="best">0</b></div><div class="stat"><span>COINS</span><b id="coins">0</b></div><div class="stat"><span>LEVEL</span><b id="level">1 • NORMAL</b></div></div><div id="savePill" class="save-pill">GESPEICHERT</div></div>
    <div id="overlay" class="overlay"><section class="card"><div class="eyebrow">3D ENDLESS RUNNER</div><h1>DON’T STOP</h1><p id="overlayText">Weiche realistischen Straßenhindernissen aus, sammle Coins und schalte immer schwierigere Level frei.</p><div class="buttons"><button id="startBtn" class="btn primary" type="button">PLAY</button><button id="resumeBtn" class="btn" type="button" hidden>RUN FORTSETZEN</button><a class="btn" href="./index.html">HAUPTMENÜ</a><a class="btn" href="./progress.html">LEVELS · GARAGE · UPGRADES</a></div><div class="hint">PC: ← → / A D · Springen: ↑ / W / Leertaste · Handy: Buttons oder Wischen</div></section></div>
    <div class="controls"><button id="leftBtn" class="control" type="button" aria-label="Nach links">◀</button><button id="jumpBtn" class="control" type="button" aria-label="Springen">⬆</button><button id="rightBtn" class="control" type="button" aria-label="Nach rechts">▶</button></div>
  </main>
  <script src="./save.js?v=stable9"></script>
  <script src="./build-info.js?v=stable9"></script>
  <script src="./game-core.js?v=perspective1"></script>
</body>
</html>
