name: Build DON’T STOP Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web build directory
        run: |
          rm -rf www
          mkdir -p www
          cp index.html save.js sw.js manifest.webmanifest icon.svg www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DONT-STOP.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Android
          path: DONT-STOP.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" DONT-STOP.apk \
            --title "DON’T STOP Android Build $GITHUB_RUN_NUMBER" \
            --notes "Automatisch aus dem aktuellen main-Stand gebaut. Installierbare Android-Testversion von DON’T STOP." \
            --latest
