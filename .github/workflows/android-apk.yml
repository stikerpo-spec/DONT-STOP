name: Build DONT STOP Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read app version
        id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Create build metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          fs.writeFileSync('build-info.js', `window.DontStopBuild = { version: '${pkg.version}', commit: '${process.env.GITHUB_SHA}' };\n`);
          NODE

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html game.html game.js save.js auth.js realism.js sw.js update.js build-info.js manifest.webmanifest icon.svg www/

      - name: Create Android project
        run: npx cap add android

      - name: Install native in-app updater
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          test -n "$MAIN_ACTIVITY"
          JAVA_DIR=$(dirname "$MAIN_ACTIVITY")
          cp native/android/DontStopUpdater.java "$JAVA_DIR/DontStopUpdater.java"
          mkdir -p android/app/src/main/res/xml
          cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          main = next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          text = main.read_text()
          if 'import com.stikerpo.dontstop.DontStopUpdater;' not in text:
              text = text.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport com.stikerpo.dontstop.DontStopUpdater;')
          if 'registerPlugin(DontStopUpdater.class);' not in text:
              text = text.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(DontStopUpdater.class);\n    }')
          main.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in text:
              first_close = text.find('>')
              if first_close == -1:
                  raise SystemExit('AndroidManifest.xml hat keinen gültigen Manifest-Start.')
              text = text[:first_close + 1] + '\n    ' + permission + text[first_close + 1:]
          provider = '''\n        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_paths" />\n        </provider>'''
          if 'androidx.core.content.FileProvider' not in text:
              text = text.replace('</application>', provider + '\n    </application>')
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          version_code = 1000 + int(os.environ['GITHUB_RUN_NUMBER'])
          version_name = os.environ['APP_VERSION']
          text = re.sub(r'(?m)^\s*versionCode\s+\d+', f'        versionCode {version_code}', text)
          text = re.sub(r'(?m)^\s*versionName\s+"[^"]+"', f'        versionName "{version_name}"', text)
          gradle.write_text(text)
          PY
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Sync Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DONT-STOP.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Android
          path: DONT-STOP.apk
          if-no-files-found: error

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'DONT-STOP.apk'; then
              gh release delete-asset "$TAG" DONT-STOP.apk --repo "$GITHUB_REPOSITORY" --yes
            fi
            gh release upload "$TAG" DONT-STOP.apk --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" DONT-STOP.apk --repo "$GITHUB_REPOSITORY" --title "DONT STOP Android" --notes "Aktueller 3D-Android-Installer von DONT STOP." --latest=false
          fi
