name: Build DONT STOP Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create build metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          fs.writeFileSync('build-info.js', `window.DontStopBuild = { version: '${pkg.version}', commit: '${process.env.GITHUB_SHA}', run: ${process.env.GITHUB_RUN_NUMBER} };\n`);
          NODE

      - name: Prepare web files
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          cp index.html game.html game.js save.js auth.js realism.js sw.js update.js build-info.js manifest.webmanifest icon.svg www/

      - name: Create Android project
        shell: bash
        run: npx cap add android

      - name: Install native updater and signing configuration
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/dontstop-release.jks
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          test -n "$MAIN_ACTIVITY"
          JAVA_DIR=$(dirname "$MAIN_ACTIVITY")
          cp native/android/DontStopUpdater.java "$JAVA_DIR/DontStopUpdater.java"
          mkdir -p android/app/src/main/res/xml
          cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          base64 -d native/android/dontstop-release.jks.b64 > "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          main = next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          text = main.read_text()
          import_line = 'import com.stikerpo.dontstop.DontStopUpdater;'
          marker = 'import com.getcapacitor.BridgeActivity;'
          if import_line not in text:
              if marker not in text:
                  raise SystemExit('BridgeActivity-Import in MainActivity.java nicht gefunden.')
              text = text.replace(marker, marker + '\n' + import_line)
          marker = 'public class MainActivity extends BridgeActivity {'
          if 'registerPlugin(DontStopUpdater.class);' not in text:
              if marker not in text:
                  raise SystemExit('MainActivity-Klasse nicht gefunden.')
              text = text.replace(marker, marker + '''\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(DontStopUpdater.class);\n    }''')
          main.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in text:
              match = re.search(r'<manifest\b[^>]*>', text)
              if not match:
                  raise SystemExit('AndroidManifest.xml: <manifest>-Element nicht gefunden.')
              text = text[:match.end()] + '\n    ' + permission + text[match.end():]
          provider = '''\n        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_paths" />\n        </provider>'''
          if 'androidx.core.content.FileProvider' not in text:
              if '</application>' not in text:
                  raise SystemExit('AndroidManifest.xml: </application> nicht gefunden.')
              text = text.replace('</application>', provider + '\n    </application>')
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          version_code = 1000 + int(os.environ['GITHUB_RUN_NUMBER'])
          text, count = re.subn(r'(?m)^\s*versionCode\s+\d+', f'        versionCode {version_code}', text, count=1)
          if count != 1:
              raise SystemExit('build.gradle: versionCode nicht gefunden.')
          text, count = re.subn(r'(?m)^\s*versionName\s+"[^"]+"', f'        versionName "{os.environ["APP_VERSION"]}"', text, count=1)
          if count != 1:
              raise SystemExit('build.gradle: versionName nicht gefunden.')

          signing = '''    signingConfigs {\n        release {\n            storeFile file(System.getenv("SIGNING_STORE_FILE"))\n            storePassword System.getenv("SIGNING_STORE_PASSWORD")\n            keyAlias System.getenv("SIGNING_KEY_ALIAS")\n            keyPassword System.getenv("SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in text:
              marker = '    buildTypes {'
              if marker not in text:
                  raise SystemExit('build.gradle: buildTypes nicht gefunden.')
              text = text.replace(marker, signing + marker, 1)
          text, count = re.subn(r'(?s)(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1)
          if count != 1:
              raise SystemExit('build.gradle: release signingConfig konnte nicht gesetzt werden.')
          gradle.write_text(text)
          PY

      - name: Sync Android project
        shell: bash
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Build signed APK
        working-directory: android
        shell: bash
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/dontstop-release.jks
          SIGNING_STORE_PASSWORD: dontstop-dev-2026
          SIGNING_KEY_ALIAS: dontstop
          SIGNING_KEY_PASSWORD: dontstop-dev-2026
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signing
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare APK files
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "DONT-STOP-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "DONT-STOP.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Android-${{ github.run_number }}
          path: "DONT-STOP-v${{ env.APP_VERSION }}-build${{ github.run_number }}.apk"
          if-no-files-found: error
          overwrite: true

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=android-latest
          VERSIONED="DONT-STOP-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          STABLE="DONT-STOP.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VERSIONED" "$STABLE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$VERSIONED" "$STABLE" --repo "$GITHUB_REPOSITORY" --title "DONT STOP Android" --notes "Aktueller 3D-Android-Installer von DONT STOP." --latest=false
          fi
