name: Build DONT STOP Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create build metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('build-info.js', `window.DontStopBuild = { version: '1.2.0', commit: '${process.env.GITHUB_SHA}' };\n`);
          NODE

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html game.html game.js save.js auth.js sw.js update.js build-info.js manifest.webmanifest icon.svg www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DONT-STOP.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Android
          path: DONT-STOP.apk
          if-no-files-found: error

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'DONT-STOP.apk'; then
              gh release delete-asset "$TAG" DONT-STOP.apk --repo "$GITHUB_REPOSITORY" --yes
            fi
            gh release upload "$TAG" DONT-STOP.apk --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" DONT-STOP.apk --repo "$GITHUB_REPOSITORY" --title "DONT STOP Android" --notes "Aktueller 3D-Android-Installer von DONT STOP." --latest=false
          fi
