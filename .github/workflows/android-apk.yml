name: Build DONT STOP Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Prepare web bundle
        run: |
          rm -rf www
          mkdir -p www/assets
          cp index.html progress.html game.html game.js save.js auth.js realism.js update.js progression.js levels20.js features.js build-info.js manifest.webmanifest icon.svg www/
          cp assets/*.svg www/assets/
      - name: Create Android project
        run: npx cap add android
      - name: Add updater and release signing
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/dontstop-release.jks
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          test -n "$MAIN_ACTIVITY"
          JAVA_DIR=$(dirname "$MAIN_ACTIVITY")
          cp native/android/DontStopUpdater.java "$JAVA_DIR/DontStopUpdater.java"
          mkdir -p android/app/src/main/res/xml
          cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          base64 -d native/android/dontstop-release.jks.b64 > "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"
          python3 - <<'PY'
from pathlib import Path
import os
import re

main = next(Path('android/app/src/main/java').rglob('MainActivity.java'))
text = main.read_text()
imp = 'import com.stikerpo.dontstop.DontStopUpdater;'
bridge = 'import com.getcapacitor.BridgeActivity;'
if imp not in text:
    if bridge not in text: raise SystemExit('BridgeActivity import missing')
    text = text.replace(bridge, bridge + '\n' + imp, 1)
cls = 'public class MainActivity extends BridgeActivity {'
register = '''public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(DontStopUpdater.class);\n    }'''
if 'registerPlugin(DontStopUpdater.class);' not in text:
    if cls not in text: raise SystemExit('MainActivity class missing')
    text = text.replace(cls, register, 1)
main.write_text(text)

manifest = Path('android/app/src/main/AndroidManifest.xml')
text = manifest.read_text()
permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
if permission not in text:
    start = text.find('<manifest')
    if start < 0: raise SystemExit('manifest tag missing')
    end = text.find('>', start)
    if end < 0: raise SystemExit('manifest tag end missing')
    text = text[:end+1] + '\n    ' + permission + text[end+1:]
provider = '''        <provider
            android:name="androidx.core.content.FileProvider"
            android:authorities="${applicationId}.fileprovider"
            android:exported="false"
            android:grantUriPermissions="true">
            <meta-data
                android:name="android.support.FILE_PROVIDER_PATHS"
                android:resource="@xml/file_paths" />
        </provider>'''
if 'androidx.core.content.FileProvider' not in text:
    close = text.find('</application>')
    if close < 0: raise SystemExit('application close tag missing')
    text = text[:close] + provider + '\n    ' + text[close:]
manifest.write_text(text)

gradle = Path('android/app/build.gradle')
text = gradle.read_text()
vc = 1000 + int(os.environ['GITHUB_RUN_NUMBER'])
text, count = re.subn(r'(?m)^\s*versionCode\s+\d+', f'        versionCode {vc}', text, count=1)
if count != 1: raise SystemExit('versionCode missing')
text, count = re.subn(r'(?m)^\s*versionName\s+"[^"]+"', f'        versionName "{os.environ["APP_VERSION"]}"', text, count=1)
if count != 1: raise SystemExit('versionName missing')
signing = '''    signingConfigs {
        release {
            storeFile file(System.getenv("SIGNING_STORE_FILE"))
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }

'''
if 'signingConfigs {' not in text:
    marker = '    buildTypes {'
    if marker not in text: raise SystemExit('buildTypes missing')
    text = text.replace(marker, signing + marker, 1)
text, count = re.subn(r'(?s)(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1)
if count != 1: raise SystemExit('release signingConfig missing')
gradle.write_text(text)
PY
      - name: Sync
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Build signed APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/dontstop-release.jks
          SIGNING_STORE_PASSWORD: dontstop-dev-2026
          SIGNING_KEY_ALIAS: dontstop
          SIGNING_KEY_PASSWORD: dontstop-dev-2026
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "DONT-STOP-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "DONT-STOP.apk"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Android-${{ github.run_number }}
          path: "DONT-STOP-v${{ env.APP_VERSION }}-build${{ github.run_number }}.apk"
          if-no-files-found: error
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=android-latest
          VERSIONED="DONT-STOP-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          STABLE="DONT-STOP.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VERSIONED" "$STABLE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$VERSIONED" "$STABLE" --repo "$GITHUB_REPOSITORY" --title "DONT STOP Android" --notes "Aktueller 3D-Android-Installer von DONT STOP." --latest=false
          fi
