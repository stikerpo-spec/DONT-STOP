name: Build DONT STOP Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source
        run: npm run check
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Create build metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          fs.writeFileSync('build-info.js', `window.DontStopBuild = { version: '${pkg.version}', commit: '${process.env.GITHUB_SHA}', run: ${process.env.GITHUB_RUN_NUMBER} };\n`);
          NODE
      - name: Prepare web bundle
        shell: bash
        run: |
          rm -rf www
          mkdir -p www/assets
          cp index.html progress.html game.html game-stable.js canvas-quality.js discord-native.js interaction-fix.js save.js auth.js update.js progression.js levels20.js features.js build-info.js manifest.webmanifest icon.svg terms.html privacy.html www/
          cp assets/*.svg www/assets/
      - name: Validate web bundle
        shell: bash
        run: |
          test -s www/index.html
          test -s www/game.html
          test -s www/game-stable.js
          test -s www/canvas-quality.js
          test -s www/discord-native.js
          test -s www/interaction-fix.js
          test -s www/save.js
          test -s www/update.js
          test -s www/progress.html
          test -s www/terms.html
          test -s www/privacy.html
          for f in www/*.html; do
            grep -o 'src="[^"]*\.js[^\"]*"' "$f" | sed -E 's/src="([^\"]+)">/\1/' | while read -r src; do
              case "$src" in
                http*) ;;
                ./*) test -s "www/${src#./}" ;;
                *) test -s "www/$src" ;;
              esac
            done
          done
      - name: Create Android project
        run: npx cap add android
      - name: Add updater and release signing
        shell: bash
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/dontstop-release.jks
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          test -n "$MAIN_ACTIVITY"
          JAVA_DIR=$(dirname "$MAIN_ACTIVITY")
          cp native/android/DontStopUpdater.java "$JAVA_DIR/DontStopUpdater.java"
          mkdir -p android/app/src/main/res/xml
          cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          base64 -d native/android/dontstop-release.jks.b64 > "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          main = next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          text = main.read_text()
          imp = 'import com.stikerpo.dontstop.DontStopUpdater;'
          bridge = 'import com.getcapacitor.BridgeActivity;'
          if imp not in text:
              if bridge not in text: raise SystemExit('BridgeActivity import missing')
              text = text.replace(bridge, bridge + '\n' + imp, 1)
          marker = 'public class MainActivity extends BridgeActivity {'
          block = '''public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(DontStopUpdater.class);\n    }'''
          if 'registerPlugin(DontStopUpdater.class);' not in text:
              if marker not in text: raise SystemExit('MainActivity class missing')
              text = text.replace(marker, block, 1)
          main.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in text:
              start = text.find('<manifest'); end = text.find('>', start)
              if start < 0 or end < 0: raise SystemExit('Android manifest tag missing')
              text = text[:end+1] + '\n    ' + permission + text[end+1:]
          provider = '''        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_paths" />\n        </provider>'''
          if 'androidx.core.content.FileProvider' not in text:
              close = text.find('</application>')
              if close < 0: raise SystemExit('Android application tag missing')
              text = text[:close] + provider + '\n    ' + text[close:]
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          vc = 1000 + int(os.environ['GITHUB_RUN_NUMBER'])
          text, n = re.subn(r'(?m)^\s*versionCode\s+\d+', f'        versionCode {vc}', text, count=1)
          if n != 1: raise SystemExit('versionCode missing')
          text, n = re.subn(r'(?m)^\s*versionName\s+"[^"]+"', f'        versionName "{os.environ["APP_VERSION"]}"', text, count=1)
          if n != 1: raise SystemExit('versionName missing')
          if 'signingConfigs {' not in text:
              signing = '''    signingConfigs {\n        release {\n            storeFile file(System.getenv("SIGNING_STORE_FILE"))\n            storePassword System.getenv("SIGNING_STORE_PASSWORD")\n            keyAlias System.getenv("SIGNING_KEY_ALIAS")\n            keyPassword System.getenv("SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
              marker = '    buildTypes {'
              if marker not in text: raise SystemExit('buildTypes missing')
              text = text.replace(marker, signing + marker, 1)
          if 'signingConfig signingConfigs.release' not in text:
              text, n = re.subn(r'(?s)(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1)
              if n != 1: raise SystemExit('release signing config missing')
          gradle.write_text(text)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Build signed APK
        working-directory: android
        shell: bash
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/dontstop-release.jks
          SIGNING_STORE_PASSWORD: dontstop-dev-2026
          SIGNING_KEY_ALIAS: dontstop
          SIGNING_KEY_PASSWORD: dontstop-dev-2026
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Prepare release files
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "DONT-STOP-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "DONT-STOP.apk"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Android-${{ github.run_number }}
          path: "DONT-STOP-v${{ env.APP_VERSION }}-build${{ env.GITHUB_RUN_NUMBER }}.apk"
          if-no-files-found: error
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=android-latest
          VERSIONED="DONT-STOP-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          STABLE="DONT-STOP.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          fi
          gh release create "$TAG" "$VERSIONED" "$STABLE" --repo "$GITHUB_REPOSITORY" --title "DONT STOP Android" --notes "DONT STOP $APP_VERSION" --latest=false
