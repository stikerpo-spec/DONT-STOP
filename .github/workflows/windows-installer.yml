name: Build DONT STOP Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create build metadata
        shell: pwsh
        run: |
          Set-Content -Path build-info.js -Value "window.DontStopBuild = { version: '1.0.6', commit: '${env:GITHUB_SHA}' };"

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Windows
          path: dist/DONT-STOP-Setup.exe
          if-no-files-found: error

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-latest'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
            if ($assets -contains 'DONT-STOP-Setup.exe') {
              gh release delete-asset $tag 'DONT-STOP-Setup.exe' --repo $env:GITHUB_REPOSITORY --yes
            }
            gh release upload $tag 'dist/DONT-STOP-Setup.exe' --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag 'dist/DONT-STOP-Setup.exe' --repo $env:GITHUB_REPOSITORY --title 'DONT STOP Windows' --notes 'Aktueller Windows-Installer von DONT STOP.' --latest=false
          }
