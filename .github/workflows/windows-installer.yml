name: Build DONT STOP Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Create build metadata
        shell: pwsh
        run: |
          Set-Content -Path build-info.js -Value "window.DontStopBuild = { version: '$env:APP_VERSION', commit: '${env:GITHUB_SHA}', run: ${env:GITHUB_RUN_NUMBER} };"

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Prepare installer files
        shell: pwsh
        run: |
          Copy-Item 'dist/DONT-STOP-Setup.exe' "dist/DONT-STOP-Setup-v$env:APP_VERSION-build${env:GITHUB_RUN_NUMBER}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Windows-${{ github.run_number }}
          path: dist/DONT-STOP-Setup.exe
          if-no-files-found: error
          overwrite: true

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-latest'
          $repo = $env:GITHUB_REPOSITORY
          $versioned = "dist/DONT-STOP-Setup-v$env:APP_VERSION-build${env:GITHUB_RUN_NUMBER}.exe"
          $stable = 'dist/DONT-STOP-Setup.exe'

          if (gh release view $tag --repo $repo 2>$null) {
            gh release upload $tag $versioned $stable --repo $repo --clobber
          } else {
            gh release create $tag $versioned $stable --repo $repo --title 'DONT STOP Windows' --notes 'Aktueller realistischer 3D-Windows-Installer von DONT STOP.' --latest=false
          }
