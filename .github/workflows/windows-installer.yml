name: Build DONT STOP Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create build metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Set-Content -Path build-info.js -Value "window.DontStopBuild = { version: '$version', commit: '${env:GITHUB_SHA}' };"

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONT-STOP-Windows
          path: dist/DONT-STOP-Setup.exe
          if-no-files-found: error
          overwrite: true

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-latest'
          $repo = $env:GITHUB_REPOSITORY

          if (gh release view $tag --repo $repo 2>$null) {
            $assetId = gh release view $tag --repo $repo --json assets --jq '.assets[] | select(.name=="DONT-STOP-Setup.exe") | .id' | Select-Object -First 1
            if ($assetId) {
              gh api --method DELETE "repos/$repo/releases/assets/$assetId"
            }
            gh release upload $tag 'dist/DONT-STOP-Setup.exe' --repo $repo
          } else {
            gh release create $tag 'dist/DONT-STOP-Setup.exe' --repo $repo --title 'DONT STOP Windows' --notes 'Aktueller realistischer 3D-Windows-Installer von DONT STOP.' --latest=false
          }
