<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050711">
  <title>DON'T STOP • Discord Activity</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:Inter,system-ui,sans-serif}
    .loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#17234a 0,#080b16 55%,#050711 100%)}
    .card{text-align:center;width:min(460px,calc(100% - 40px));padding:28px;border:1px solid #ffffff18;border-radius:24px;background:#0c1120e8;box-shadow:0 30px 80px #0008}
    h1{margin:0 0 10px;font-size:42px;letter-spacing:-.06em}.muted{color:#a5aec5;line-height:1.6}.error{color:#ff9a9a}
  </style>
</head>
<body>
  <div class="loading"><section class="card"><h1>DON’T STOP</h1><div id="status" class="muted">Discord Activity wird gestartet…</div></section></div>
  <script type="module">
    const CLIENT_ID = '1543556589368254515';
    const status = document.getElementById('status');
    const fail = (message) => {
      status.textContent = message;
      status.className = 'muted error';
    };

    try {
      const { DiscordSDK } = await import('/sdk/@discord/embedded-app-sdk@2.5.0');
      const discordSdk = new DiscordSDK(CLIENT_ID);

      await discordSdk.ready();

      // Set the Activity Rich Presence while the Activity is running.
      // Discord requires the rpc.activities.write scope for this command.
      await discordSdk.commands.setActivity({
        activity: {
          type: 0,
          details: "DON'T STOP",
          state: 'Spielt gerade',
          timestamps: { start: Math.floor(Date.now() / 1000) },
          assets: {
            large_image: 'dontstop_logo',
            large_text: "DON'T STOP"
          },
          instance: true
        }
      });

      status.textContent = 'Verbunden. DON’T STOP wird geladen…';

      // Keep the Activity in the Discord client.
      window.location.replace('../game.html');
    } catch (error) {
      console.error('Discord Activity error:', error);
      fail('Discord konnte die Activity nicht starten. Prüfe URL-Mapping, Activity-Freigabe und rpc.activities.write.');
    }
  </script>
</body>
</html>
