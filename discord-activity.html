<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<title>DON'T STOP • Discord Activity</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:Inter,system-ui,sans-serif}#root{width:100%;height:100%;position:relative}#status{position:absolute;left:12px;top:12px;z-index:50;padding:8px 12px;border-radius:12px;background:#0d1220cc;border:1px solid #ffffff1a;font-size:12px;color:#b8c1d8;backdrop-filter:blur(10px);pointer-events:none}.error{color:#ff9a9a}.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#17234a 0,#080b16 55%,#050711 100%)}.card{width:min(520px,100%);padding:28px;border:1px solid #ffffff18;border-radius:24px;background:#0c1120e8;text-align:center;box-shadow:0 30px 80px #0008}.card h1{margin:0 0 10px;font-size:46px;letter-spacing:-.06em}.card p{margin:0 0 18px;color:#a5aec5;line-height:1.6}.btn{display:inline-flex;min-height:48px;padding:0 18px;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#735cff,#a24dff);color:#fff;text-decoration:none;font-weight:900}.hidden{display:none!important}</style>
</head>
<body>
<div id="root"></div>
<div id="status">DISCORD ACTIVITY WIRD GELADEN…</div>
<script type="module">
const root=document.getElementById('root');
const status=document.getElementById('status');
const setStatus=(text,error=false)=>{status.textContent=text;status.className=error?'error':''};

function fallback(message){
  root.innerHTML=`<div class="fallback"><section class="card"><h1>DON’T STOP</h1><p>${message}</p><a class="btn" href="./game.html">SPIEL ÖFFNEN</a></section></div>`;
}

try {
  const sdk=await import('https://esm.sh/@discord/embedded-app-sdk@latest');
  const DiscordSDK=sdk.DiscordSDK;
  const discordSdk=new DiscordSDK('1543556589368254515');
  await discordSdk.ready();
  setStatus('DISCORD ACTIVITY BEREIT');

  root.innerHTML=`<iframe title="DON'T STOP" src="./game.html" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#050711"></iframe>`;

  // Keep the Activity alive; game.html remains the canonical game UI.
  // The SDK connection is intentionally isolated so a Discord-side issue cannot break the game UI.
} catch(error) {
  console.error(error);
  setStatus('DISCORD ACTIVITY NICHT VERBUNDEN',true);
  fallback('Die Discord Activity konnte den Embedded App SDK-Handshake nicht abschließen. Das normale DON’T STOP-Spiel bleibt verfügbar.');
}
</script>
</body>
</html>
